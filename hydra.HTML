<html>
<head>
    <style>
        .title{
            text-align: center;
            color: rgb(6, 88, 155);
            font-size: 100px;
            transition: 0.4s;
        }

        .title:hover {
            background-position: center;
            background-size: cover;
            padding: 20px;
            transition: 0.4s;
        }

        .title:hover .normal{
            display: none;
        }

        .title:hover .secret{
            display: inline;
        }

        .secret{
            color: red;
            display: none;
        }

        .body{
            background-image: url("shield.gif");
            background-position: center;
            background-size: cover;
            padding: 20px;
            transition: 0.4s;    
        }

        .body:has(.title:hover){
            background-image: url("hydra_img.gif") ;
        }

    </style>

</head>

<body class="body">

    <h1 class="title">

        <span class="normal"> S.H.I.E.L.D </span>

        <span class="secret"> HYDRA </span>
    </h1>

</body>

</html>
